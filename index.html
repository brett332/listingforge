<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ListingForge</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#111009;--surf:#1c1a14;--surf2:#252318;--bdr:#3a3620;--acc:#d4a843;--txt:#ede8d8;--muted:#a09880;--dim:#6b6450;--red:#c45c3a;--grn:#5a9e72;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--txt);font-family:'IBM Plex Sans',sans-serif;font-size:14px;min-height:100vh;}
header{background:var(--surf);border-bottom:1px solid var(--bdr);padding:0 24px;height:56px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;}
.logo{font-family:'Playfair Display',serif;font-weight:900;font-size:1.3rem;color:var(--acc);}
.logo-sub{font-family:'IBM Plex Mono',monospace;font-size:.55rem;color:var(--dim);letter-spacing:.15em;text-transform:uppercase;}
.hsp{flex:1;}
.layout{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 56px);}
@media(max-width:768px){.layout{grid-template-columns:1fr;}}
.sb{background:var(--surf);border-right:1px solid var(--bdr);display:flex;flex-direction:column;overflow-y:auto;max-height:calc(100vh - 56px);}
.ss{padding:14px 16px;border-bottom:1px solid var(--bdr);}
.slbl{font-size:.57rem;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin-bottom:8px;font-family:'IBM Plex Mono',monospace;}
.prod-card{padding:9px 11px;border-radius:6px;border:1px solid var(--bdr);background:var(--surf2);cursor:pointer;margin-bottom:5px;transition:all .15s;}
.prod-card:hover,.prod-card.active{border-color:var(--acc);background:rgba(212,168,67,.06);}
.prod-name{font-weight:600;font-size:.78rem;}
.prod-code{font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:var(--acc);}
.prod-price{font-size:.65rem;color:var(--muted);}
.loc-item{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:5px;border:1px solid transparent;cursor:pointer;transition:all .12s;font-size:.7rem;user-select:none;margin-bottom:2px;}
.loc-item:hover{border-color:var(--bdr);}
.loc-item.chk{border-color:rgba(90,158,114,.4);background:rgba(90,158,114,.07);color:var(--grn);}
.lck{width:13px;height:13px;border:1px solid var(--bdr);border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.55rem;}
.loc-item.chk .lck{background:var(--grn);border-color:var(--grn);color:#0f0f11;}
.loc-code{font-family:'IBM Plex Mono',monospace;font-size:.58rem;color:var(--dim);margin-left:auto;}
.field{margin-bottom:10px;}
.field label{display:block;font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:4px;font-family:'IBM Plex Mono',monospace;}
.field input,.field textarea{width:100%;background:var(--bg);border:1px solid var(--bdr);border-radius:5px;padding:7px 9px;color:var(--txt);font-family:'IBM Plex Sans',sans-serif;font-size:.78rem;outline:none;transition:border-color .15s;}
.field input:focus,.field textarea:focus{border-color:var(--acc);}
.field textarea{resize:vertical;min-height:60px;}
.gen-btn{width:100%;padding:11px;background:var(--acc);color:#111009;border:none;border-radius:7px;font-family:'Playfair Display',serif;font-weight:700;font-size:.92rem;cursor:pointer;transition:all .15s;}
.gen-btn:hover{background:#e0b84d;}
.gen-btn:disabled{background:var(--bdr);color:var(--dim);cursor:not-allowed;}
.panel{padding:20px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);text-align:center;padding:80px 20px;min-height:400px;}
.empty-ico{font-size:2.5rem;opacity:.25;}
.empty-txt{font-size:.75rem;line-height:1.8;max-width:320px;}
.listing-card{background:var(--surf);border:1px solid var(--bdr);border-radius:10px;overflow:hidden;}
.listing-hdr{padding:11px 15px;background:var(--surf2);border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:10px;}
.listing-loc{font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--acc);font-weight:500;}
.listing-sku{font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:var(--dim);background:rgba(0,0,0,.3);padding:2px 7px;border-radius:3px;}
.listing-hsp{flex:1;}
.listing-price{font-size:.65rem;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
.listing-body{padding:14px;}
.lf{margin-bottom:12px;}
.lf-lbl{font-size:.57rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-family:'IBM Plex Mono',monospace;margin-bottom:4px;display:flex;align-items:center;gap:8px;}
.cc{font-size:.57rem;padding:2px 6px;border-radius:3px;background:rgba(0,0,0,.3);}
.cc.ok{color:var(--grn);}.cc.warn{color:#d4a843;}.cc.over{color:var(--red);}
.lf-content{background:var(--bg);border:1px solid var(--bdr);border-radius:6px;padding:9px 11px;font-size:.8rem;line-height:1.7;color:var(--txt);white-space:pre-wrap;word-break:break-word;}
.lf-content.title-box{font-size:.88rem;font-weight:600;background:rgba(212,168,67,.05);border-color:rgba(212,168,67,.2);color:var(--acc);}
.copy-btn{padding:3px 9px;background:transparent;border:1px solid var(--bdr);border-radius:4px;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:.58rem;cursor:pointer;transition:all .15s;margin-left:auto;}
.copy-btn:hover,.copy-btn.copied{border-color:var(--grn);color:var(--grn);}
.gpc{background:rgba(90,158,114,.06);border:1px solid rgba(90,158,114,.2);border-radius:7px;padding:12px;margin-top:8px;}
.gpl{font-size:.58rem;text-transform:uppercase;letter-spacing:.1em;color:var(--grn);font-family:'IBM Plex Mono',monospace;margin-bottom:7px;display:flex;align-items:center;justify-content:space-between;}
.gp-content{font-size:.78rem;line-height:1.7;white-space:pre-wrap;}
.loading-card{background:var(--surf);border:1px solid var(--bdr);border-radius:10px;padding:18px;display:flex;align-items:center;gap:12px;}
.spinner{width:16px;height:16px;border:2px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-txt{font-size:.72rem;color:var(--muted);}
.timing-note{background:rgba(196,92,58,.08);border:1px solid rgba(196,92,58,.25);border-radius:7px;padding:11px 13px;font-size:.7rem;line-height:1.7;color:#e8a080;}
.timing-note strong{color:var(--red);display:block;margin-bottom:3px;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px;}

// ── DIMENSION TRACKING — no two listings share the same phrasing ─────────────
var usedDimIdx = {};
function getUniqueDim(prod, idx) {
  if (!usedDimIdx[prod.id]) usedDimIdx[prod.id] = [];
  var used = usedDimIdx[prod.id];
  var avail = prod.dims.map(function(_,i){return i;}).filter(function(i){return used.indexOf(i)===-1;});
  if (!avail.length) { usedDimIdx[prod.id]=[]; avail=prod.dims.map(function(_,i){return i;}); }
  var pick = avail[idx % avail.length];
  used.push(pick);
  return prod.dims[pick];
}

function shuffleArr(arr, seed) {
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){var j=Math.floor((seed*9301+49297)%233280/233280*(i+1));seed=seed*9301+49297;var t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}

function buildSKU(prod, loc) {
  return loc.cityCode+'-'+prod.code+'-'+loc.sub;
}

function updateLocCodes() {
  var prod = getActiveProd();
  LOCATIONS.forEach(function(loc){
    var el = document.getElementById('lcode-'+loc.id);
    if (el) el.textContent = prod ? buildSKU(prod, loc) : '--';
  });
}

function getActiveProd(){
  var el=document.querySelector('.prod-card.active');
  if(!el)return null;
  return PRODUCTS.find(function(p){return p.id===el.dataset.id;});
}
function getChkLocs(){
  return Array.from(document.querySelectorAll('.loc-item.chk')).map(function(el){
    return LOCATIONS.find(function(l){return l.id===el.dataset.id;});
  });
}
function updBtn(){

    var w=document.createElement('div');
    w.className='timing-note';
    w.innerHTML='<strong>⚠ Posting Reminder</strong>Never post all locations same day — FB flags it. Baltimore quadrants Wednesday, Winchester/Waynesboro Thursday. Stagger across 2 days minimum.';
    panel.appendChild(w);
  }

  var allLocNames=locs.map(function(l){return l.name;}).join(', ');
  var placeholders=[];

  locs.forEach(function(loc,idx){
    var card=document.createElement('div');
    card.className='loading-card';
    card.id='lc-'+loc.id;
    card.innerHTML='<div class="spinner"></div><div class="loading-txt">Generating '+loc.name+'…</div>';
    panel.appendChild(card);
    placeholders.push(card);

    generateOne(prod,loc,price,oNote,idx,allLocNames,locs).then(function(result){
      var newCard=buildCard(result);
      panel.replaceChild(newCard,card);
    }).catch(function(err){
      card.innerHTML='<div style="color:var(--red);font-size:.73rem;">Failed for '+loc.name+': '+err.message+'</div>';
    });
  });
}

async function generateOne(prod,loc,price,oNote,idx,allLocNames,allLocs) {
  var dimString=getUniqueDim(prod,idx);
  var seed=Date.now()+idx*7919;
  var shuffledUses=shuffleArr(prod.useCases,seed);
  var uses=shuffledUses.slice(0,4);
  var sku=buildSKU(prod,loc);
  var locsBeforeThis=allLocs.slice(0,idx).map(function(l){return l.name;}).join(', ')||'none yet';

  var titleInstruction='Choose a title angle that is COMPLETELY UNIQUE for this listing ('+loc.name+'). '
    +'This session covers: '+allLocNames+'. Already generated for: '+locsBeforeThis+'. '
    +'Draw from these angles OR invent your own — the key is no two titles in this session should lead with the same approach: '
    +'scarcity lead, material/quality lead, use-case lead, origin/provenance lead, price/value lead, size/spec lead, action verb lead, season lead, buyer-profile lead, curiosity lead. '
    +'Under 70 characters. No city name. No ALL CAPS. No clichés.';

  var prompt='You are writing a Facebook Marketplace listing.\n\n'
    +'PRODUCT: '+prod.name+'\n'
    +'SKU: '+sku+'\n'
    +'PRICE: '+price+'\n'
    +'CONDITION: '+prod.condition+'\n'
    +'MATERIAL: '+prod.material+'\n'
    +(prod.brand?'BRAND: '+prod.brand+'\n':'')
    +'DIMENSIONS — use EXACTLY this wording verbatim: "'+dimString+'"\n'
    +'SOURCING: '+prod.sourcing+'\n'
    +'USE CASES in this exact order: '+uses.map(function(u,i){return (i+1)+'. '+u;}).join(' | ')+'\n'
    +'PAYMENT: '+prod.payment+'\n'
    +'DELIVERY: '+prod.delivery+'\n'
    +'NOTES: '+prod.notes+'\n'
    +(oNote?'SELLER NOTE: '+oNote+'\n':'')
    +'\nTITLE INSTRUCTION: '+titleInstruction+'\n'
    +'\nDESCRIPTION RULES:\n'
    +'- Professional, confident tone. Not casual or chatty. Writes like someone who knows their product.\n'
    +'- Open with ONE strong hook sentence — not a greeting, not "Looking for X", not "Great deal". Something specific and compelling.\n'
    +'- Short product paragraph: use the EXACT dimension string given above verbatim, mention material and sourcing naturally.\n'
    +'- Use cases: mention them in the order given. 1-2 lines, specific not generic.\n'
    +'- Pickup, delivery, and payment info woven in naturally.\n'
    +'- End with SKU on its own line: '+sku+'\n'
    +'- Total: 120-180 words. Tight. No filler.\n'
    +'- NEVER use: "Look no further", "Perfect for any", "Don\'t miss out", "Great deal", "You won\'t be disappointed", "Amazing", "Gorgeous"\n'
    +'- The EXACT dimension string must appear verbatim — do not rephrase it.\n'
    +'\nGROUP POST (separate, for Facebook buy/sell groups in '+loc.area+'):\n'
    +'Write 2-3 sentences. Casual but not desperate. Lead with what it is and the price. Include general pickup area naturally. End with soft CTA. Under 60 words.\n'
    +'\nFormat your response EXACTLY as:\n'
    +'TITLE: [title here]\n\n'
    +'[description here]\n\n'
    +'===GROUP===\n'
    +'[group post here]';

  var res=await fetch(WORKER,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:650,messages:[{role:'user',content:prompt}]})
  });
  if(!res.ok) throw new Error('API '+res.status);
  var data=await res.json();
  var raw=data.content.map(function(b){return b.text||'';}).join('');

  var parts=raw.split('===GROUP===');
  var main=parts[0].trim();
  var group=(parts[1]||'').trim();
  var lines=main.split('\n');
  var title=lines[0].replace(/^TITLE:\s*/i,'').trim();
  var desc=lines.slice(1).join('\n').trim();
  if(desc.indexOf(sku)===-1) desc+='\n\n'+sku;

  return {prod:prod,loc:loc,sku:sku,price:price,title:title,desc:desc,group:group};
}

// ── BUILD CARD ──────────────────────────────────────────────────────────────
function buildCard(r) {
  var card=document.createElement('div');
  card.className='listing-card';
  var tl=r.title.length;
  var tc=tl<=70?'ok':tl<=80?'warn':'over';
  card.innerHTML='<div class="listing-hdr">'
    +'<span class="listing-loc">'+r.loc.name+'</span>'
    +'<span class="listing-sku">'+r.sku+'</span>'
    +'<div class="listing-hsp"></div>'
    +'<span class="listing-price">'+r.price+'</span>'
    +'</div>'
    +'<div class="listing-body">'
    +'<div class="lf"><div class="lf-lbl">Title <span class="cc '+tc+'">'+tl+' chars</span><button class="copy-btn" data-copy="title-'+r.loc.id+'">Copy</button></div>'
    +'<div class="lf-content title-box" id="title-'+r.loc.id+'">'+escH(r.title)+'</div></div>'
    +'<div class="lf"><div class="lf-lbl">Description <button class="copy-btn" data-copy="desc-'+r.loc.id+'">Copy</button></div>'
    +'<div class="lf-content" id="desc-'+r.loc.id+'">'+escH(r.desc)+'</div></div>'
    +(r.group?'<div class="gpc"><div class="gpl">Group Post <button class="copy-btn" data-copy="gp-'+r.loc.id+'">Copy</button></div>'
    +'<div class="gp-content" id="gp-'+r.loc.id+'">'+escH(r.group)+'</div></div>':'')
    +'</div>';
  card.addEventListener('click',function(e){
    var btn=e.target.closest('.copy-btn');
    if(!btn)return;
    var id=btn.dataset.copy;
    var el=document.getElementById(id);
    if(!el)return;
    navigator.clipboard.writeText(el.innerText).then(function(){
      btn.textContent='Copied ✓';btn.classList.add('copied');
      setTimeout(function(){btn.textContent='Copy';btn.classList.remove('copied');},2000);
    });
  });
  return card;
}

function escH(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
